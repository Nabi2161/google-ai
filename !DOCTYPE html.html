<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天吃什麼</title>
    <style>
        body {
            font-family: 'Segoe UI', '微軟正黑體', 'Arial Rounded MT Bold', Arial, sans-serif;
            background: linear-gradient(135deg, #ffe0f0 0%, #ffd6e0 100%);
            margin: 0; padding: 0;
        }
        .container {
            max-width: 420px;
            margin: 40px auto;
            background: #fff0faee;
            border-radius: 24px;
            box-shadow: 0 4px 24px #f8b6d8a0;
            padding: 32px 20px 24px 20px;
            border: 2.5px solid #ffb6d5;
        }
        h2 {
            text-align: center;
            color: #ff69b4;
            font-size: 2.1em;
            letter-spacing: 2px;
            margin-bottom: 18px;
            text-shadow: 0 2px 8px #fff6fa;
        }
        .chat-box {
            min-height: 120px;
            max-height: 320px;
            overflow-y: auto;
            border: 2px dashed #ffb6d5;
            border-radius: 16px;
            padding: 16px;
            background: #fff6fa;
            margin-bottom: 18px;
        }
        .msg {
            margin: 10px 0;
            font-size: 1.08em;
        }
        .user {
            color: #ff7eb9;
            font-weight: bold;
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
        }
        .ai {
            color: #ff69b4;
            font-weight: bold;
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
        }
        #optionsArea button {
            margin: 10px 0 0 0;
            padding: 10px 22px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(90deg, #ffb6d5 0%, #ff69b4 100%);
            color: #fff;
            font-size: 1.08em;
            font-weight: bold;
            box-shadow: 0 2px 8px #ffb6d555;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: block;
            width: 90%;
        }
        #optionsArea button:hover {
            background: linear-gradient(90deg, #ff69b4 0%, #ffb6d5 100%);
            transform: scale(1.07);
        }
        #optionsArea button:disabled {
            background: #ffd6e0;
            color: #fff0fa;
        }
        input[type="password"] {
            border: 2px solid #ffb6d5;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 1em;
            background: #fff6fa;
            color: #d63384;
            outline: none;
            margin-bottom: 6px;
        }
        input[type="password"]:focus {
            border-color: #ff69b4;
            background: #fff0fa;
        }
        #setApiKeyBtn {
            background: linear-gradient(90deg, #ffb6d5 0%, #ff69b4 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 8px 18px;
            font-size: 1em;
            font-weight: bold;
            margin-left: 8px;
            box-shadow: 0 2px 8px #ffb6d555;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        #setApiKeyBtn:hover {
            background: linear-gradient(90deg, #ff69b4 0%, #ffb6d5 100%);
            transform: scale(1.07);
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>今天吃什麼</h2>
        <div style="margin-bottom:16px;">
            <input type="password" id="apiKeyInput" placeholder="請輸入 Google AI API Key" style="width:70%;padding:8px;border-radius:4px;border:1px solid #ccc;" />
            <button id="setApiKeyBtn">啟用</button>
        </div>
        <div class="chat-box" id="chatBox"></div>
        <div id="optionsArea"></div>
    </div>
    <script>
        let API_KEY = '';
        let API_URL = '';
        const chatBox = document.getElementById('chatBox');
        const optionsArea = document.getElementById('optionsArea');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const setApiKeyBtn = document.getElementById('setApiKeyBtn');

        setApiKeyBtn.onclick = function() {
            const key = apiKeyInput.value.trim();
            if (!key) {
                alert('請輸入 API Key');
                return;
            }
            API_KEY = key;
            API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro-latest:generateContent?key=' + API_KEY;
            apiKeyInput.disabled = true;
            setApiKeyBtn.disabled = true;
            appendMsg('ai', 'API Key 已設定，可以開始互動！');
            showStep1();
        };

        function appendMsg(sender, text) {
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="${sender}">${sender === 'user' ? '你' : 'AI'}：</span> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showOptions(options, onSelect, block=false) {
            optionsArea.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.onclick = () => onSelect(opt);
                if(block) {
                    btn.style.display = 'block';
                    btn.style.width = '90%';
                    btn.style.margin = '10px 0 0 0';
                }
                optionsArea.appendChild(btn);
            });
        }

        // 第一步：選餐次
        function showStep1() {
            appendMsg('ai', '請選擇餐次：');
            showOptions(['早餐', '午餐', '晚餐'], step1Selected);
        }

        let mealType = '';
        let cuisineType = '';
        let mainDish = '';
        let drink = '';

        function step1Selected(opt) {
            mealType = opt;
            appendMsg('user', opt);
            showStep2();
        }

        // 第二步：選中餐/西餐/糕點
        function showStep2() {
            appendMsg('ai', '請選擇餐點類型：');
            showOptions(['中餐', '西餐', '糕點'], step2Selected);
        }
        function step2Selected(opt) {
            cuisineType = opt;
            appendMsg('user', opt);
            getMainDishOptions();
        }

        // 第三步：AI 推薦五個主餐選項
        async function getMainDishOptions() {
            appendMsg('ai', '正在為你推薦主餐選項...');
            showOptions([], ()=>{});
            const prompt = `請推薦五個${mealType}${cuisineType}，只需用逗號分隔菜名即可。`;
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            let dishes = text.replace(/\\n/g, '').split(/,|，/).map(s=>s.trim()).filter(Boolean).slice(0,5);
            if (dishes.length === 0) dishes = ['無法推薦'];
            appendMsg('ai', '請選擇主餐：');
            showOptions(dishes, mainDishSelected);
        }

        function mainDishSelected(opt) {
            mainDish = opt;
            appendMsg('user', opt);
            getDrinkOptions();
        }

        // 第四步：AI 推薦五個飲料選項（分開五個按鈕，block）
        async function getDrinkOptions() {
            appendMsg('ai', '正在為你推薦搭配的飲料選項...');
            showOptions([], ()=>{});
            const prompt = `請推薦五杯適合搭配${mainDish}的飲料，只需用逗號分隔飲料名稱即可。`;
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
            let drinks = text.replace(/\\n/g, '').split(/,|，/).map(s=>s.trim()).filter(Boolean).slice(0,5);
            if (drinks.length === 0) drinks = ['無法推薦'];
            appendMsg('ai', '請選擇飲料：');
            // 分開五個按鈕（block）
            showOptions(drinks, drinkSelected, true);
        }

        function drinkSelected(opt) {
            drink = opt;
            appendMsg('user', opt);
            appendMsg('ai', `你今天的${mealType}${cuisineType}推薦是：<br><b>${mainDish}</b> + <b>${drink}</b>！`);
            showOptions(['重新選擇'], () => { location.reload(); });
        }
    </script>
</body>
</html>
